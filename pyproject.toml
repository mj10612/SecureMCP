[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-mcp"
version = "0.1.0"
description = "Grammar-Preserving Zero-Knowledge Semantic Masking & Anonymization MCP Server for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SecureMCP Contributors", email = "maintainers@securemcp.org" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "privacy",
    "anonymization",
    "token-masking",
    "llm-security",
    "openai",
    "claude",
    "anthropic",
    "zero-knowledge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
secure-mcp = "secure_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
